# Nginx config — use this if deploying to a Digital Ocean Droplet (not App Platform).
# Place in /etc/nginx/sites-available/mindfullyarticulated and symlink to sites-enabled.
# Replace /var/www/mad-website/dist with wherever you upload the build output.

server {
    listen 80;
    server_name mindfullyarticulated.com www.mindfullyarticulated.com;

    # Redirect HTTP → HTTPS
    return 301 https://www.mindfullyarticulated.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mindfullyarticulated.com;

    # Redirect bare domain → www (matches .htaccess canonical)
    return 301 https://www.mindfullyarticulated.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mindfullyarticulated.com;

    root /var/www/mad-website/dist;
    index index.html;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/www.mindfullyarticulated.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mindfullyarticulated.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SPA routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets (JS/CSS/images from Vite build)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for HTML (always fetch fresh index.html)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag            "index, follow"                  always;
}
